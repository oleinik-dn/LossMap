# Деплой по кнопке. ВЫКЛЮЧЕН по умолчанию: запускается только вручную (Actions → Deploy → Run workflow)
# и только если в Settings → Variables задана переменная DEPLOY_ENABLED = true.
# Секреты (Settings → Secrets): DEPLOY_SSH_KEY (приватный ключ), DEPLOY_KNOWN_HOSTS (ssh-keyscan сервера),
# DEPLOY_USER, DEPLOY_HOST. Необязательно: переменная DEPLOY_PORT.
name: Deploy

on:
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Build and deploy
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          CADDY_CONTAINER: ${{ vars.CADDY_CONTAINER || 'ai-project-agent-caddy-1' }}
        run: ./deploy/deploy.sh
