<!doctype html>
<html><head><meta charset="utf-8"><style>
@font-face{font-family:Manrope;font-weight:800;src:url(../public/fonts/manrope-cyrillic-800-normal.woff2) format('woff2');unicode-range:U+0400-045F}
@font-face{font-family:Manrope;font-weight:800;src:url(../public/fonts/manrope-latin-800-normal.woff2) format('woff2');unicode-range:U+0000-00FF}
@font-face{font-family:JBM;font-weight:400;src:url(../public/fonts/jetbrains-mono-cyrillic-400-normal.woff2) format('woff2');unicode-range:U+0400-045F}
@font-face{font-family:JBM;font-weight:400;src:url(../public/fonts/jetbrains-mono-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+2022}
html,body{margin:0}
body{width:1200px;height:630px;box-sizing:border-box;padding:72px 80px;background:#0B0F14;background-image:radial-gradient(rgba(154,163,174,.18) 1px,transparent 1px);background-size:24px 24px;color:#E8EBEF;font-family:Manrope,sans-serif;display:flex;flex-direction:column;justify-content:space-between}
.logo{display:flex;align-items:center;gap:16px;font-weight:800;font-size:40px;letter-spacing:-.02em}
h1{margin:0;font-weight:800;font-size:76px;line-height:1.04;letter-spacing:-.03em;max-width:900px}
.row{display:flex;justify-content:space-between;align-items:flex-end}
.eb{font-family:JBM,monospace;font-size:22px;letter-spacing:.06em;text-transform:uppercase;color:#9AA3AE;display:flex;align-items:center;gap:14px}
.dot{width:12px;height:12px;border-radius:50%;background:#2DD4BF}
.bars{display:flex;flex-direction:column;gap:10px;width:260px}
.bars i{display:block;height:16px;border-radius:3px}
.url{font-family:JBM,monospace;font-size:24px;color:#2DD4BF}
</style></head><body>
<div class="logo"><svg width="52" height="52" viewBox="0 0 28 28"><rect x="2" y="2" width="24" height="24" rx="6" fill="none" stroke="#E8EBEF" stroke-width="2"/><rect x="7" y="15" width="3" height="7" fill="#E8EBEF"/><rect x="12.5" y="10" width="3" height="5" fill="#F59E0B"/><rect x="18" y="7" width="3" height="15" fill="#2DD4BF"/></svg>LossMap</div>
<h1>Ваши данные уже знают, где&nbsp;теряются деньги</h1>
<div class="row">
  <div style="display:flex;flex-direction:column;gap:14px"><div class="eb"><span class="dot"></span>Аудит потерь · пищевые производства</div><div class="url">lossmap.pro</div></div>
  <div class="bars"><i style="width:100%;background:#F59E0B"></i><i style="width:65%;background:#F59E0B"></i><i style="width:53%;background:#D97F06"></i><i style="width:41%;background:#B86A08"></i></div>
</div>
</body></html>
